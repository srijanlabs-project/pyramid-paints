<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pyramid Paints | Coming Soon</title>
  <style>
    :root {
      --teal-1: #1eb5b2;
      --teal-2: #149f9d;
      --pink-1: #f6a0bd;
      --peach: #f2b389;
      --deep-teal: #0f6f6f;
      --deep-teal-2: #0a575a;
      --text-light: #f8f4f1;
      --text-soft: #f4e3d8;
      --card-bg: rgba(255, 255, 255, 0.14);
      --card-border: rgba(255, 255, 255, 0.38);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text-light);
      background: linear-gradient(180deg, #5ec2be 0%, #67b7b6 35%, #5aa8aa 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .stage {
      width: min(980px, 100%);
      min-height: 620px;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(0, 62, 62, 0.35);
      background: linear-gradient(180deg, var(--teal-1) 0%, var(--teal-2) 40%, var(--peach) 70%, var(--pink-1) 100%);
      isolation: isolate;
    }

    .circle {
      position: absolute;
      top: 92px;
      right: 150px;
      width: 260px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 20%, #85daff 0%, #95d4e6 35%, #ff8b8d 70%, #b64993 100%);
      opacity: 0.95;
    }

    .logo-wrap {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px 8px 8px;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(4px);
    }

    .logo-text {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fffdfa;
      white-space: nowrap;
    }

    .title {
      position: absolute;
      top: 110px;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(2.2rem, 7vw, 4rem);
      letter-spacing: 0.28em;
      font-weight: 300;
      text-transform: uppercase;
      text-align: center;
      width: 100%;
      padding: 0 20px;
      z-index: 2;
      text-shadow: 0 3px 15px rgba(0, 0, 0, 0.15);
    }

    .title b {
      font-weight: 800;
    }

    .content {
      position: absolute;
      left: 50%;
      bottom: 118px;
      transform: translateX(-50%);
      width: min(740px, calc(100% - 34px));
      z-index: 3;
    }

    .label {
      text-align: center;
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      margin-bottom: 18px;
      text-transform: uppercase;
      color: #fffaf6;
      text-shadow: 0 2px 7px rgba(0, 0, 0, 0.25);
    }

    .contact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .contact-item {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(5px);
      border-radius: 999px;
      padding: 12px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
    }

    .contact-key {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-soft);
      white-space: nowrap;
    }

    .contact-value,
    .contact-value a {
      font-size: 0.94rem;
      color: #ffffff;
      text-decoration: none;
      overflow-wrap: anywhere;
    }

    .hill-1,
    .hill-2,
    .hill-3 {
      position: absolute;
      left: -4%;
      width: 112%;
      border-radius: 50% 50% 0 0;
      pointer-events: none;
    }

    .hill-1 {
      height: 170px;
      bottom: 105px;
      background: #159f9f;
      clip-path: polygon(0 40%, 35% 55%, 58% 45%, 100% 20%, 100% 100%, 0 100%);
      opacity: 0.95;
    }

    .hill-2 {
      height: 170px;
      bottom: 72px;
      background: var(--deep-teal);
      clip-path: polygon(0 52%, 34% 42%, 56% 46%, 100% 72%, 100% 100%, 0 100%);
      opacity: 0.95;
    }

    .hill-3 {
      height: 210px;
      bottom: -25px;
      background: var(--deep-teal-2);
      clip-path: polygon(0 40%, 42% 32%, 66% 42%, 100% 62%, 100% 100%, 0 100%);
    }

    .brand {
      position: absolute;
      left: 20px;
      bottom: 16px;
      font-size: 0.84rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.82);
      z-index: 4;
    }

    @media (max-width: 900px) {
      .stage {
        min-height: 700px;
      }

      .logo-wrap {
        top: 14px;
        left: 14px;
        padding: 8px 10px 8px 8px;
      }

      .logo-text {
        font-size: 0.82rem;
      }

      .circle {
        right: 50%;
        transform: translateX(50%);
        top: 126px;
        width: 210px;
      }

      .title {
        top: 78px;
        letter-spacing: 0.16em;
      }

      .content {
        bottom: 125px;
      }

      .contact-grid {
        grid-template-columns: 1fr;
      }

      .contact-item {
        border-radius: 20px;
        align-items: flex-start;
        flex-direction: column;
        gap: 6px;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="logo-wrap" aria-label="Pyramid Paints logo">
      <svg width="66" height="56" viewBox="0 0 66 56" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Pyramid logo">
        <polygon points="33,4 6,43 33,49" fill="#f98a4b"></polygon>
        <polygon points="33,4 33,49 60,30" fill="#f56f3d"></polygon>
        <polygon points="33,4 24,37 33,49" fill="#ff9354" opacity="0.7"></polygon>
      </svg>
      <p class="logo-text">Pyramid Paints</p>
    </div>

    <div class="circle" aria-hidden="true"></div>

    <h1 class="title">Coming <b>Soon</b></h1>

    <section class="content" aria-label="Contact details">
      <p class="label">Contact Details</p>

      <div class="contact-grid">
        <article class="contact-item">
          <span class="contact-key">Email</span>
          <p class="contact-value"><a href="mailto:arvind.chavan@pyramidpaints.com">arvind.chavan@pyramidpaints.com</a></p>
        </article>

        <article class="contact-item">
          <span class="contact-key">Phone</span>
          <p class="contact-value"><a href="tel:+917700953772">+91 7700 953 772</a></p>
        </article>

        <article class="contact-item">
          <span class="contact-key">Location</span>
          <p class="contact-value">Pune, Maharashtra, India</p>
        </article>

        <article class="contact-item">
          <span class="contact-key">Hours</span>
          <p class="contact-value">Monday to Friday, 9:30 AM - 6:30 PM IST</p>
        </article>
      </div>
    </section>

    <div class="hill-1" aria-hidden="true"></div>
    <div class="hill-2" aria-hidden="true"></div>
    <div class="hill-3" aria-hidden="true"></div>

    <p class="brand">Pyramid Paints</p>
  </main>
</body>
</html>
